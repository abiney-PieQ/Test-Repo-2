# Stub production deploy for SyncPoint local testing.
# Multi-job stages so GitHub Actions shows a validate → build → test → deploy graph.
name: Deploy Production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workspace
        run: |
          set -euo pipefail
          echo "Stage: validate (production)"
          echo "repository=${{ github.repository }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          test -n "${{ github.sha }}"
          sleep 4

  build:
    name: build
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build artifact (stub)
        run: |
          set -euo pipefail
          echo "Stage: build (production)"
          mkdir -p dist
          echo "production-build-${{ github.sha }}" > dist/build-info.txt
          cat dist/build-info.txt
          sleep 5

  test:
    name: test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Run tests (stub)
        run: |
          set -euo pipefail
          echo "Stage: test (production)"
          echo "All stub tests passed"
          sleep 5

  deploy:
    name: deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production (stub)
        run: |
          set -euo pipefail
          echo "Stage: deploy (production)"
          echo "repository=${{ github.repository }}"
          echo "sha=${{ github.sha }}"
          sleep 6
          echo "Production deploy simulation complete"
