# Stub production deploy for SyncPoint local testing.
# Matches config_dev.yml github.workflowProductionFileName (PIEQ_ENVIRONMENT=dev).
# SyncPoint API triggers this via workflow_dispatch (POST .../actions/workflows/deploy-production.yml/dispatches).
name: Deploy Production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Simulate production deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workspace
        run: |
          set -euo pipefail
          echo "Validating production workspace"
          echo "repository=${{ github.repository }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          test -n "${{ github.sha }}"
          sleep 3

      - name: Build artifact (stub)
        run: |
          set -euo pipefail
          echo "Building production artifact (stub)"
          mkdir -p dist
          echo "production-build-${{ github.sha }}" > dist/build-info.txt
          cat dist/build-info.txt
          sleep 4

      - name: Deploy to production (stub)
        run: |
          set -euo pipefail
          echo "Deploying to production (stub)"
          echo "artifact=$(cat dist/build-info.txt)"
          sleep 5
          echo "Production deploy simulation complete"
