# Stub preprod/staging deploy for SyncPoint local testing.
# Matches config_dev.yml github.workflowFileName (PIEQ_ENVIRONMENT=dev).
# SyncPoint API triggers this via workflow_dispatch (POST .../actions/workflows/deploy-staging.yml/dispatches).
name: Deploy Staging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Simulate staging deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Simulate preprod deploy
        run: |
          set -euo pipefail
          echo "SyncPoint test deploy (staging/preprod)"
          echo "repository=${{ github.repository }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          # Brief pause so the SPA workflow-run poller can observe in_progress → completed
          sleep 8
          echo "Staging deploy simulation complete"
