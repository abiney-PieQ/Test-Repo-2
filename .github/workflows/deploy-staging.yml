# Stub preprod/staging deploy for SyncPoint local testing.
# Matches config_dev.yml github.workflowFileName (PIEQ_ENVIRONMENT=dev).
# SyncPoint API triggers this via workflow_dispatch (POST .../actions/workflows/deploy-staging.yml/dispatches).
name: Deploy Staging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Simulate staging deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workspace
        run: |
          set -euo pipefail
          echo "Validating staging workspace"
          echo "repository=${{ github.repository }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          test -n "${{ github.sha }}"
          sleep 3

      - name: Build artifact (stub)
        run: |
          set -euo pipefail
          echo "Building staging artifact (stub)"
          mkdir -p dist
          echo "staging-build-${{ github.sha }}" > dist/build-info.txt
          cat dist/build-info.txt
          sleep 4

      - name: Deploy to staging (stub)
        run: |
          set -euo pipefail
          echo "Deploying to staging/preprod (stub)"
          echo "artifact=$(cat dist/build-info.txt)"
          sleep 5
          echo "Staging deploy simulation complete"
